async function derive(password){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(salt),iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}

function forget(){try{localStorage.removeItem(store)}catch(_){}try{sessionStorage.removeItem(store)}catch(_){}}
