function render(html){document.open();document.write(html);document.close()}
form.onsubmit=async e=>{e.preventDefault();button.disabled=true;button.textContent='Открываем…';error.textContent='';try{const key=await derive(input.value),html=await open(key);try{sessionStorage.setItem(store,encode(await crypto.subtle.exportKey('raw',key)))}catch(_){}input.value='';render(html)}catch(e){error.textContent=e.message==='old-browser'?'Для открытия нужен современный браузер.':!window.crypto?.subtle?'Откройте страницу по HTTPS в современном браузере.':'Пароль не подошёл. Проверьте регистр и символы.';button.disabled=false;button.textContent='Открыть материалы';input.select()}};
let saved;try{saved=sessionStorage.getItem(store)}catch(_){}if(saved){try{const key=await crypto.subtle.importKey('raw',bytes(saved),'AES-GCM',false,['decrypt']);render(await open(key))}catch(_){try{sessionStorage.removeItem(store)}catch(_){}}}
})();
