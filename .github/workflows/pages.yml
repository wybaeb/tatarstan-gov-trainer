name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Verify encrypted-only artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')
          pages=['index.html','labs/index.html','labs/harmonics.html','labs/distributions.html','labs/experiment.html']
          for name in pages:
              text=Path(name).read_text()
              assert 'const payload=' in text and 'AES-GCM' in text, name
          assert not list(root.glob('*.js'))
          assert not Path('data').exists() and not Path('downloads').exists()
          PY
          mkdir -p _site
          cp index.html confidence-interval.html favicon.svg _site/
          cp -R labs _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
