async function derive(password){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(salt),iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
async function open(key){const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(iv)},key,bytes(payload));if(!window.DecompressionStream)throw Error('old-browser');const text=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();return text}
function remember(raw){try{localStorage.setItem(store,raw)}catch(_){}try{sessionStorage.setItem(store,raw)}catch(_){}}
function forget(){try{localStorage.removeItem(store)}catch(_){}try{sessionStorage.removeItem(store)}catch(_){}}
function render(html){document.open();document.write(html);document.close()}
form.onsubmit=async e=>{e.preventDefault();button.disabled=true;button.textContent='Открываем…';error.textContent='';try{const key=await derive(input.value),html=await open(key);remember(encode(await crypto.subtle.exportKey('raw',key)));input.value='';render(html)}catch(e){error.textContent=e.message==='old-browser'?'Для открытия нужен современный браузер.':!window.crypto?.subtle?'Откройте страницу по HTTPS в современном браузере.':'Пароль не подошёл. Проверьте регистр и символы.';button.disabled=false;button.textContent='Открыть материалы';input.select()}};
let saved;try{saved=localStorage.getItem(store)}catch(_){}if(!saved)try{saved=sessionStorage.getItem(store)}catch(_){}if(saved){document.getElementById('gate').style.visibility='hidden';try{const key=await crypto.subtle.importKey('raw',bytes(saved),'AES-GCM',false,['decrypt']);const html=await open(key);remember(saved);render(html)}catch(_){forget();document.getElementById('gate').style.visibility='visible'}}
})();
</script></body></html>
